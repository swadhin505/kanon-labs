name: Kanon gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -q

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build dashboard
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run reliability gate
        shell: bash
        run: |
          set +e
          python -m kanon gate run data/health-insurance --agent good --trials 3 --baseline ui/data/baseline.json --save runs/ci.json 2>&1 | tee gate-summary.md
          status=${PIPESTATUS[0]}
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload run evidence
        if: always() && hashFiles('runs/ci.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: kanon-run
          path: |
            runs/ci.json
            gate-summary.md
